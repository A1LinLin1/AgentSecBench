name: Security-ADG artifact checks

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/security-adg-artifacts.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/security-adg-artifacts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build-showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Security-ADG tests
        run: >-
          python -m unittest
          tests/test_security_adg_dataflow.py
          tests/test_security_adg_showcase.py
          tests/test_heldout_reproduction_case_matrix.py
          tests/test_guard_ablation_table.py
          tests/test_paper_results_snapshot.py
          tests/test_export_paper_tables.py
      - name: Build deterministic showcase fixture
        run: >-
          python scripts/generate_security_adg_showcase.py
          --graphs tests/fixtures/security_adg_showcase.jsonl
          --output-dir artifacts/security-adg-ci-showcase
          --max-graphs 2
      - name: Upload interactive evidence view
        uses: actions/upload-artifact@v4
        with:
          name: security-adg-showcase
          path: artifacts/security-adg-ci-showcase
          if-no-files-found: error
      - name: Build deterministic held-out case matrix fixture
        run: >-
          python scripts/build_heldout_reproduction_case_matrix.py
          --input-dir tests/fixtures/heldout_reproduction
          --output-dir artifacts/heldout-case-matrix-fixture
      - name: Upload held-out case matrix fixture
        uses: actions/upload-artifact@v4
        with:
          name: heldout-case-matrix-fixture
          path: artifacts/heldout-case-matrix-fixture
          if-no-files-found: error
      - name: Build deterministic guard ablation fixture
        run: >-
          python scripts/build_guard_ablation_table.py
          --matrix artifacts/heldout-case-matrix-fixture/heldout_reproduction_case_matrix.json
          --output-dir artifacts/guard-ablation-fixture
      - name: Upload guard ablation fixture
        uses: actions/upload-artifact@v4
        with:
          name: guard-ablation-fixture
          path: artifacts/guard-ablation-fixture
          if-no-files-found: error
      - name: Build deterministic paper results snapshot fixture
        run: >-
          python scripts/build_paper_results_snapshot.py
          --matrix artifacts/heldout-case-matrix-fixture/heldout_reproduction_case_matrix.json
          --ablation artifacts/guard-ablation-fixture/guard_ablation_summary.json
          --output-dir artifacts/paper-results-snapshot-fixture
      - name: Upload paper results snapshot fixture
        uses: actions/upload-artifact@v4
        with:
          name: paper-results-snapshot-fixture
          path: artifacts/paper-results-snapshot-fixture
          if-no-files-found: error
      - name: Build deterministic paper table fixture
        run: >-
          python scripts/export_paper_tables.py
          --snapshot artifacts/paper-results-snapshot-fixture/paper_results_snapshot.json
          --output-dir artifacts/paper-table-fixture
      - name: Upload paper table fixture
        uses: actions/upload-artifact@v4
        with:
          name: paper-table-fixture
          path: artifacts/paper-table-fixture
          if-no-files-found: error
